      version: "1.2"
      notes: |
        Comprehensive architecture design completed (v1.2 updated).
        Key architectural decisions:
        - Hybrid pattern: State Machine + Component-Based + Three-Layer Separation
        - Core Layer (pure C#, no Godot) for 100% testability
        - Service Layer (minimal Godot) for managers and orchestration
        - Presentation Layer (full Godot) for scenes and UI
        - GameManager with explicit state machine (MainMenu/ModeSelection/Playing/GameOver)
        - Separate scene files for each game mode (SingleMatch/Tournament/Survival/Multiplayer)
        - Records for data objects (immutable value types)
        - GUT framework for testing (80%+ coverage target)
        - AI random only (no difficulty levels per requirements)
        - Two-stage multiplayer transitions: (1) P1 looks away for P2's turn, (2) P1 returns for shared reveal

